{% extends 'base_personal.html' %}
{% block clase_contenedor %}container py-5{% endblock %}
{% block contenido %}
    <h3 class="mb-4">Ingresar doctor</h3>

    <!-- Al dar click en Guardar, se manda un POST a /guardar -->
    <form method="POST" action="/guardar" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Especialidad</label>
        <input type="text" name="especialidad" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Estado</label>
        <select name="estado" class="form-select">
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Guardar</button>
    </form>

  {% endblock %}
