<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clínica Rodríguez</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="bg-white border-bottom py-4 text-center">
    <h1 class="fw-bold" style="color:#e07a5f;">Clínica Rodríguez</h1>
    <p class="text-muted mb-0">Gestión de doctores</p>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <div class="collapse navbar-collapse justify-content-center">
        <ul class="navbar-nav gap-3">
          <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/ingresar">Ingresar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/consultar">Consultar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/actualizar">Actualizar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/eliminar">Eliminar doctor</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h3 class="mb-4">Ingresar doctor</h3>

    <!-- Al dar click en Guardar, se manda un POST a /guardar -->
    <form method="POST" action="/guardar" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Especialidad</label>
        <input type="text" name="especialidad" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Estado</label>
        <select name="estado" class="form-select">
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Guardar</button>
    </form>

  </main>

</body>
</html>
