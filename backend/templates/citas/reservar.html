<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Clínica Rodríguez</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="bg-white border-bottom py-4 text-center">
    <h1 class="fw-bold" style="color:#e07a5f;">Clínica Rodríguez</h1>
    <p class="text-muted mb-0">Gestión de citas</p>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <div class="collapse navbar-collapse justify-content-center">
        <ul class="navbar-nav gap-3">
          <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="/ingresar">Ingresar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/consultar">Consultar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/actualizar">Actualizar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/eliminar">Eliminar doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="/reservar">Reservar cita</a></li>
          <li class="nav-item"><a class="nav-link" href="/actualizar-cita">Actualizar cita</a></li>
          <li class="nav-item"><a class="nav-link" href="/mis-citas">Mis citas</a></li>
          <li class="nav-item"><a class="nav-link" href="/panel-citas">Panel de citas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h3 class="mb-4">Reservar cita</h3>

    <!-- Al dar click en Reservar, se manda un POST a /guardar-cita -->
    <form method="POST" action="/guardar-cita" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">

      <div class="mb-3">
        <label class="form-label">Nombre del paciente</label>
        <input type="text" name="paciente_nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="paciente_email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="paciente_telefono" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Selecciona el doctor</label>
        <select name="doctor_id" class="form-select" required>
          <option value="" selected disabled>-- elige un doctor --</option>
          {% for d in doctores %}
          <option value="{{ d._id }}">{{ d.nombre }} - {{ d.especialidad }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="row">
        <div class="col mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" name="fecha" class="form-control" required>
        </div>
        <div class="col mb-3">
          <label class="form-label">Hora</label>
          <input type="time" name="hora" class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Motivo de la consulta</label>
        <textarea name="motivo" class="form-control" rows="3" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Reservar</button>
    </form>

  </main>

</body>

</html>
