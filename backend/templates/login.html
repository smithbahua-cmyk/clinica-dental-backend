{% extends 'base_personal.html' %}{% block contenido %}
<div class="card shadow-sm mx-auto" style="max-width:440px"><div class="card-body p-4"><h2>Ingreso del personal</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="correo" class="form-label">Correo</label><input id="correo" type="email" name="correo" autocomplete="username" class="form-control mb-3" required>
<label for="clave" class="form-label">Clave</label><input id="clave" type="password" name="clave" autocomplete="current-password" class="form-control mb-3" required><button class="btn btn-primary w-100">Ingresar</button></form>
{% if primer_registro %}<a class="d-block mt-3" href="/empleados">Registrar primer empleado</a>{% endif %}
</div></div>{% endblock %}
